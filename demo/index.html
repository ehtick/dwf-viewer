<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DWF Viewer Demo</title>
  <meta name="description" content="The world's first open-source pure frontend DWF/DWFx preview component. English by default, switchable to Chinese." />
  <link rel="stylesheet" href="../styles/dwf-viewer.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; background: #f6f7f9; color: #111827; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app-header { display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #d6d8dd; background: #fff; }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand strong { font-size: 16px; }
    .brand small { color: #6b7280; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, select, input { font: inherit; }
    #demoSelect { min-width: 280px; }
    #viewer { min-height: 0; }
    .hint { color: #6b7280; font-size: 12px; }
    .toggles { display: flex; gap: 12px; align-items: center; white-space: nowrap; }
    @media (max-width: 900px) { .app-header { grid-template-columns: 1fr; } .toggles { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <strong>DWF Viewer</strong>
      <small data-i18n="tagline">World's first open-source pure frontend DWF/DWFx preview component</small>
    </div>
    <input id="file" type="file" accept=".dwf,.dwfx,model/vnd.dwf,application/vnd.ms-xpsdocument" aria-label="Open local DWF or DWFx file" />
    <div class="controls">
      <select id="demoSelect" aria-label="Example file"></select>
      <button id="loadDemo" data-i18n="loadSample">Load sample</button>
      <button id="fit" data-i18n="fit">Fit</button>
      <span id="demoHint" class="hint"></span>
    </div>
    <div class="toggles">
      <label><input id="webgl" type="checkbox" checked /> <span data-i18n="webgl">WebGL acceleration</span></label>
      <label><input id="wasm" type="checkbox" checked /> <span data-i18n="wasm">WASM fallback</span></label>
      <label><span data-i18n="lineWeight">Line weight</span> <select id="lineMode"><option value="adaptive" selected>CAD adaptive</option><option value="hairline">Hairline</option><option value="physical">Physical</option></select></label>
      <label><span data-i18n="language">Language</span> <select id="language" aria-label="Language"><option value="en" selected>English</option><option value="zh">中文</option></select></label>
    </div>
  </header>
  <main id="viewer"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
